<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration</title>
<style>
* { box-sizing:border-box; font-family:"Poppins",Arial,sans-serif; }
body {
    margin:0; min-height:100vh;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex; justify-content:center; align-items:center;
    padding:20px;
}
.container {
    width:1000px; background:#fff; border-radius:14px; padding:30px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
    display:flex; gap:30px; flex-wrap:wrap;
}
@keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
h2 { text-align:center; width:100%; color:#764ba2; margin-bottom:20px; }
.form-box, .table-box { flex:1 1 450px; }
.form-box form { display:flex; flex-direction:column; gap:12px; }
.form-group { display:flex; flex-direction:column; }
label { font-size:14px; color:#444; font-weight:500; margin-bottom:4px; }
input[type="text"], input[type="email"], input[type="password"] {
    padding:10px; border-radius:8px; border:1px solid #ccc; transition:0.3s;
}
input:focus { border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.2); outline:none; }
.gender { display:flex; gap:25px; margin-top:6px; }
.gender label { display:flex; align-items:center; gap:6px; cursor:pointer; }
.btn { background:linear-gradient(135deg,#667eea,#764ba2); color:white; padding:12px; border:none; border-radius:8px; font-size:15px; cursor:pointer; margin-top:10px; transition:0.3s; }
.btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.2); }
.error { font-size:12px; color:#e63946; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
thead { background:#667eea; color:white; }
th,td { padding:12px; text-align:center; font-size:14px; }
tbody tr:hover { background:#f1f3ff; }
.action-btn { padding:6px 14px; border-radius:20px; border:none; font-size:13px; cursor:pointer; margin:2px; transition:0.3s; }
.edit { background:#2ecc71; color:white; } .edit:hover{background:#27ae60;}
.delete { background:#e74c3c; color:white;} .delete:hover{background:#c0392b;}
@media(max-width:900px){ .container{ flex-direction:column; } }
</style>
</head>
<body onload="loadUsers()">

<div class="container">
    <h2>User Registration CRUD</h2>

    <div class="form-box">
        <form onsubmit="saveUser(event)">
            <input type="hidden" id="index">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" onblur="checkName()">
                <div id="nameErr" class="error"></div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" onkeyup="checkEmail()">
                <div id="emailErr" class="error"></div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" onkeyup="checkPassword()">
                <div id="passErr" class="error"></div>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="gender">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>
            </div>
            <button class="btn" type="submit" ondblclick="resetForm()">Save User</button>
        </form>
    </div>

    <div class="table-box">
        <table>
            <thead>
                <tr><th>Name</th><th>Email</th><th>Gender</th><th>Action</th></tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>
</div>

<script>
let users = [];
let storedUsers = localStorage.getItem("users");
try {
    users = storedUsers ? JSON.parse(storedUsers) : [];
    if (!Array.isArray(users)) { users = []; localStorage.setItem("users",JSON.stringify(users)); }
} catch(e){ users=[]; localStorage.setItem("users",JSON.stringify(users)); }

function saveUser(e){
    e.preventDefault();
    let name=document.getElementById("name").value.trim();
    let email=document.getElementById("email").value.trim();
    let password=document.getElementById("password").value.trim();
    let gender=document.querySelector('input[name="gender"]:checked');
    let index=document.getElementById("index").value;
    if(!name||!email||!password||!gender){ alert("Fill all fields"); return; }
    let user={name,email,gender:gender.value};
    index==="" ? users.push(user) : users[index]=user;
    localStorage.setItem("users",JSON.stringify(users));
    resetForm();
    loadUsers();
}

function loadUsers(){
    let rows="";
    users.forEach((u,i)=>{
        rows+=`<tr>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.gender}</td>
